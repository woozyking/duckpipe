[project]
name = "duckpipe"
version = "0.2.0"
description = "A serverless-first, DuckDB-native pipeline orchestrator. No scheduler daemon, no central metadata database required, no broker — a run is a Python process that starts, does work, records what it did to a `.duckdb` file, and exits."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Runzhou Li", email = "runzhou.li@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "duckdb>=1.4.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.urls]
Homepage = "https://woozyking.github.io/duckpipe/"
Repository = "https://github.com/woozyking/duckpipe"
Issues = "https://github.com/woozyking/duckpipe/issues"
Documentation = "https://woozyking.github.io/duckpipe/docs/"
Changelog = "https://github.com/woozyking/duckpipe/blob/main/CHANGELOG.md"

[project.optional-dependencies]
remote = [
    "fsspec>=2024.10.0",
]
s3 = [
    "duckpipe[remote]",
    "s3fs>=2024.10.0",
]
gcs = [
    "duckpipe[remote]",
    "gcsfs>=2024.10.0",
]
azure = [
    "duckpipe[remote]",
    "adlfs>=2024.10.0",
]
arrow = [
    "pyarrow>=18.0.0",
]
ducklake = [
    # `ducklake`/`sqlite`/`postgres` themselves are DuckDB extensions,
    # auto-installed on first use, not Python packages -- pytz is the one
    # real dependency, needed by the `ducklake` extension's snapshot
    # listing (`ducklake_snapshots()`), which duckpipe.state.list_snapshots
    # uses for the time-travel-over-run-history story (DESIGN.md sec 8).
    "pytz>=2024.1",
]

[project.scripts]
duckpipe = "duckpipe.cli:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "polars>=1.17.0",
    "pyarrow>=18.0.0",
    "pandas>=2.2.0",
    "fsspec>=2024.10.0",
    "pytz>=2024.1",
    "duckpipe-tuning",
    "playwright>=1.62.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
duckpipe-tuning = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
