name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install (workspace)
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Test duckpipe
        run: uv run pytest

      - name: Test duckpipe-tuning
        run: uv run --directory packages/duckpipe-tuning pytest
