[project]
name = "duckpipe-tuning"
version = "0.1.0"
description = "Optional host-spec-based tuning suggestions for DuckPipe tasks (DuckDB threads/memory_limit). Not imported by duckpipe's core."
readme = "README.md"
authors = [
    { name = "Runzhou Li", email = "runzhou.li@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psutil>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
