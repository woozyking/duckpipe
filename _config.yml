title: DuckPipe
description: A serverless-first, DuckDB-native pipeline orchestrator.
theme: jekyll-theme-minimal
markdown: kramdown
url: https://woozyking.github.io
baseurl: /duckpipe

# docs/README.md is served as docs/'s index page automatically
# (jekyll-readme-index); relative links between .md files resolve to
# the right page on the published site the same way they already do
# when browsing the repo itself (jekyll-relative-links); a bare .md
# file with no front matter still becomes a real page instead of a
# static download (jekyll-optional-front-matter), titled from its own
# first heading (jekyll-titles-from-headings), and wrapped in the
# theme's own layout so it actually gets styled instead of rendering
# as a bare unwrapped HTML fragment (jekyll-default-layout -- without
# it, optional-front-matter pages get no <head>, no stylesheet, no
# theme at all). All six ship in GitHub's own `github-pages` gem and
# are auto-loaded on pages built there, but listed explicitly here so
# `bundle exec jekyll build` reproduces the same site locally (see
# .github/workflows/pages.yml).
# The root has its own hand-built index.html (the WASM playground is
# the front door, not the README) -- jekyll-readme-index leaves it
# alone whenever an index page already exists in a directory.
#
# jekyll-sitemap auto-generates sitemap.xml from whatever pages exist
# at build time -- zero upkeep, and it's what robots.txt's `Sitemap:`
# line points at. robots.txt and llms.txt are both hand-written, plain
# static files at repo root (Jekyll just passes them through): the
# former explicitly allows every crawler including AI/LLM ones, the
# latter is the llmstxt.org convention -- a curated index for an LLM to
# read instead of crawling the whole site. Keep llms.txt's link list in
# sync with docs/README.md's by hand when either changes; both are
# already independently hand-maintained indexes of the same docs.
plugins:
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-default-layout
  - jekyll-sitemap

exclude:
  - uv.lock
  - "**/__pycache__"
  - "*.duckdb"
  - "*.duckdb.wal"

# Jekyll silently drops any file/directory starting with an underscore
# by default (the same rule that hides _config.yml, _layouts/, etc.) --
# without this, files the WASM bundle needs
# (examples/08_browser_wasm/duckpipe_src/duckpipe/, written by
# prepare_bundle.py at build time, see pages.yml) never make it into
# the published site, so `import duckpipe` 404s in the browser and
# evaluates GitHub's 404 page HTML as Python. Bit each other twice now:
# first __init__.py, then a second, real regression when _memcap.py/
# _memcap_worker.py (new source modules, unrelated to Pages) got
# silently dropped the same way on a later release. `"_*.py"` covers
# any underscore-prefixed module by pattern, including ones added after
# this comment was written -- verified empirically this match is by
# bare filename, not a path glob ("**/_*.py"/"*/_*.py" do NOT work
# here, only the bare name).
include:
  - "_*.py"
